claims:
  - id: quasi_monochromatic_regime
    statement: >
      Over the 24-day (6 outer period) observation, f drifts by only 4.0%
      while 60.2 outer periods remain before merger.
    evidence:
      - run.py::main
      - tests/test_system.py::check_quasi_monochromatic_regime
    numbers: [fractional_freq_drift, n_outer_periods_observed, f_start_Hz, f_end_Hz]
  - id: half_orbit_unlensed
    statement: >
      Exactly half the outer orbit (49.97%) is unlensed (source in front of
      the lens, D_LS<0), with y formally diverging at each front/back
      crossing.
    evidence:
      - src/gwlens/geometry.py::impact_parameter_of_time
      - caseB_y_of_t.png
    numbers: [fraction_of_time_lensed]
  - id: y_min_crosscheck
    statement: >
      The minimum impact parameter reached in Case B (1.589) agrees with
      Case A's y_A (1.589) to 4 significant figures -- both are an argmin
      search over the SAME underlying function
      (geometry.impact_parameter_of_time), called separately in each case
      script at different grid resolutions (2000 samples/period in Case B,
      3600 in Case A). The agreement is a statement about grid resolution,
      not an independent confirmation of the geometry itself (corrected
      after an independent review; a previous version of this claim called
      the search code "independent").
    evidence:
      - run.py::main
      - ../case_A_chirp/run.py::main
      - ../case_A_chirp/provenance/numbers.json (y_A)
    numbers: [min_y_during_observation]
  - id: repeated_lensing_pulses
    statement: >
      |F(w_B,y(t))|^2 shows six periodic amplification pulses, one per
      outer period, peaking at 1.385, with diffraction ringing visible on
      each side; averaged over the full observation the amplification is
      close to unity (RMS 1.003) because most of the orbit is unlensed or
      only mildly amplified.
    evidence:
      - run.py::main
      - caseB_repeated_pulses.png
      - D'Orazio & Loeb (2020), "Repeated gravitational lensing of
        gravitational waves in hierarchical black hole triples"
    numbers: [max_abs_F, mean_abs_F2_over_observation, rms_amplification_over_observation]
figures:
  - file: caseB_y_of_t.png
    produced_by: run.py::main
    shows: Impact parameter over 1.5 outer periods, cropped near the minimum.
    from_scratch: The lensed/unlensed shading and the y-axis crop (from min_y, not max_y -- an earlier version autoscaled to the divergent max and hid the interesting dip; see wiki/log.md).
    from_library: matplotlib.
    supports: [half_orbit_unlensed, y_min_crosscheck]
  - file: caseB_repeated_pulses.png
    produced_by: run.py::main
    shows: "|F(w_B,y(t))|^2 over the full 6-period observation."
    from_scratch: The F(t) evaluation via F_hybrid at each sampled y(t).
    from_library: matplotlib.
    supports: [repeated_lensing_pulses]
  - file: caseB_pattern_with_orbit.png
    produced_by: run.py::main
    shows: The fixed diffraction pattern with the source's sky-projected orbit track overlaid, lensed/unlensed halves distinguished.
    from_scratch: The radial F(w_B,r) evaluation, its 2D interpolation, and the orbit projection.
    from_library: scipy.interpolate.interp1d, matplotlib (LogNorm).
    choices:
      - "y_max = 25.0, chosen by eye from min_y (not max_y, which is dominated by the near-divergent points at the D_LS=0 crossing and would zoom the whole pattern into invisibility). No FINITE y_max keeps the marker on-frame for the whole orbit -- |y| formally diverges at each crossing -- so this is a compromise: with y_max=25.0, 51% of the 900 exported orbit frames (caseB_animation_data.json) still have |y1| or |y2| exceeding it and are clamped to the frame edge by report_template.html's clampPct(); down from 78% before this value was picked. See wiki/log.md."
    supports: [y_min_crosscheck, repeated_lensing_pulses]
  - file: caseB_detector_view.png
    produced_by: run.py::main
    shows: Idealized detector strain envelope over the full observation, and a fine-time-grid zoom on one pulse's raw waveform.
    from_scratch: The dedicated fine time grid (dt=0.1s) for the zoom panel, built separately from the coarse envelope grid after the first version aliased using the coarse grid directly (see wiki/log.md).
    from_library: numpy, matplotlib.
    supports: [repeated_lensing_pulses]
