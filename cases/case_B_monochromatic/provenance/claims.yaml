claims:
  - id: quasi_monochromatic_regime
    statement: >
      Over the 12-day (3 outer period) observation, f drifts by only 1.9%
      while 60.2 outer periods remain before merger. Three periods is the
      fewest that shows the lensing repeating; a longer baseline would only
      accumulate more of the phase the leading-order waveform omits.
    evidence:
      - run.py::main
      - tests/test_system.py::check_quasi_monochromatic_regime
    numbers: [fractional_freq_drift, n_outer_periods_observed, f_start_Hz, f_end_Hz]
  - id: half_orbit_unlensed
    statement: >
      Exactly half the outer orbit (49.94%) is unlensed (source in front of
      the lens, D_LS<0), with y formally diverging at each front/back
      crossing.
    evidence:
      - src/gwlens/geometry.py::impact_parameter_of_time
      - caseB_pattern.png
    numbers: [fraction_of_time_lensed]
  - id: y_min_crosscheck
    statement: >
      The minimum impact parameter reached in Case B (1.589) agrees with
      Case A's y_A (1.589) to 4 significant figures -- both are an argmin
      search over the SAME underlying function
      (geometry.impact_parameter_of_time), called separately in each case
      script at different grid resolutions (600 samples per outer period in
      Case B, 2000 in Case A). The agreement is a statement about grid
      resolution,
      not an independent confirmation of the geometry itself (corrected
      after an independent review; a previous version of this claim called
      the search code "independent").
    evidence:
      - run.py::main
      - ../case_A_chirp/run.py::main
      - ../case_A_chirp/provenance/numbers.json (y_A)
    numbers: [min_y_during_observation]
  - id: repeated_lensing_pulses
    statement: >
      |F(w_B,y(t))|^2 shows three periodic amplification pulses, one per
      outer period, peaking at 1.384, with diffraction ringing visible on
      each side; averaged over the full observation the amplification is
      close to unity (RMS 1.003) because most of the orbit is unlensed or
      only mildly amplified.
    evidence:
      - run.py::main
      - caseB_repeated_pulses.png
      - D'Orazio & Loeb (2020), "Repeated gravitational lensing of
        gravitational waves in hierarchical black hole triples"
    numbers: [max_abs_F, mean_abs_F2_over_observation, rms_amplification_over_observation]
  - id: doppler_dominates_the_lensing
    statement: >
      The same outer orbit that produces the lensing pulses also moves the
      source along the line of sight at beta_los=0.0165, imprinting a Roemer
      (light-travel-time) modulation of 1810 s peak-to-peak = 90.5 GW cycles
      of phase at f_B. That is 5206x the phase the lens itself writes
      (arg F/2pi, 0.0174 cycles) and 527x the image time delay Delta_T=3.43 s
      at the pulse. The Doppler frequency swing (0.0025 Hz) also exceeds the
      whole intrinsic chirp drift across the observation (0.00097 Hz).
    evidence:
      - src/gwlens/doppler.py::roemer_delay
      - src/gwlens/doppler.py::emission_time
      - tests/test_doppler.py::check_roemer_dwarfs_the_image_delay
      - caseB_doppler_vs_lensing.png
      - D'Orazio & Loeb (2020), Appendix A -- the same paper this case
        follows for repeated lensing models the Doppler boost alongside it
    numbers: [roemer_delay_ptp_s, roemer_phase_ptp_cycles, beta_los_max,
              lens_phase_ptp_cycles, roemer_over_lens_phase_ratio,
              roemer_over_image_delay_ratio, image_delay_at_pulse_s,
              doppler_freq_swing_Hz, intrinsic_freq_drift_Hz]
  - id: doppler_is_pure_timing
    statement: >
      Doppler is applied by evaluating the waveform at the retarded emission
      time and multiplying by nothing else -- licensed by the identity
      dt_em/dt_obs = 1/(1+beta_los), verified to 5.5e-11. Being pure timing,
      it changes the strain envelope by only 1.1e-5, so every amplitude
      result in this case (pulse heights, <|F|^2>, RMS amplification, all
      diffraction figures) is unchanged by its addition; the waveform PHASE
      changes by 91.9 cycles. The remaining second-order and gravitational
      piece is exactly constant for a circular orbit
      ((1-3GM_L/(a c^2))^(-1/2) - 1 = 4.08e-4), hence exactly degenerate
      with the chirp mass: reported as an M_chirp bias, deliberately not
      applied.
    evidence:
      - src/gwlens/doppler.py::emission_time
      - src/gwlens/doppler.py::orbital_redshift_factor
      - tests/test_doppler.py::check_retarded_time_is_the_whole_first_order_doppler
      - tests/test_doppler.py::check_envelope_unaffected_by_roemer
    numbers: [emission_time_iterations, doppler_envelope_max_fractional_change,
              doppler_phase_ptp_cycles_vs_static, orbital_redshift_factor_minus_1]
  - id: fixed_w_approximation_quantified
    statement: >
      F is evaluated at the fixed nominal w_B, with neither the 1.9% intrinsic
      drift nor the Doppler shift fed back into it -- the same omission
      D'Orazio & Loeb (2020) make, for the same reason (lensing only happens
      where the line-of-sight velocity crosses zero, which for this
      near-edge-on circular orbit is exactly the pulse's orbital phase).
      Quantified rather than left as that argument: evaluating F at the true
      instantaneous observed frequency changes |F| by 1.0e-4 at the pulse,
      but by up to 3.5e-3 at the worst point of the lensed half, far from the
      pulse where |F| sits on a steep fringe flank at a value near 1 that
      carries no weight in any result quoted. Both numbers reported; quoting
      only the first would overclaim.
    evidence:
      - run.py::main
      - D'Orazio & Loeb (2020), main text (the argument this quantifies)
    numbers: [abs_F_relerr_from_fixed_w_at_pulse, abs_F_relerr_from_fixed_w_max]
figures:
  - file: caseB_doppler_vs_lensing.png
    produced_by: run.py::main
    shows: >
      What the outer orbit writes on the waveform, from each of the two
      mechanisms it drives, one per stacked panel on a shared time axis,
      each at its own scale. Top: the Roemer DELAY in GW cycles (90.5
      peak to peak) together with the Doppler shift v_los/c on a twin
      axis, because they are not the same thing and sit a quarter period
      apart -- at conjunction the delay is at its extremum (+904.9 s of
      +-904.9) and |v_los|/c is 1.3e-6 against an orbital maximum of
      1.645e-2, and a quarter period away it is the other way round. The
      label used to read "Roemer / Doppler", which conflated them and made
      the conjunction marker look like a claim that both peak there.
      Bottom: the lensing phase arg F/2pi (0.0174 cycles peak to peak) on
      its own dense grid, with the fixed-w systematic drawn as a band --
      the two large excursions are 21x it and are a result, the far
      ringing sits inside it and is not.
    from_scratch: The Roemer delay from the orbit (doppler.py) and arg F from the wave-optics evaluator.
    from_library: matplotlib.
    choices:
      - "Plotted in GW CYCLES, not seconds, so both curves are bounded and directly comparable. Delta_T(y(t)) is reported as a number but deliberately NOT plotted: it increases with y and so formally diverges toward each D_LS->0 crossing, where the second image's magnification goes to zero -- that divergence is the second image ceasing to exist, not a large observable delay, and a raw Delta_T(t) curve puts it on screen as if it dominated, the exact opposite of the finding."
      - "One curve per panel rather than two on one axis with an inset. A ratio of 5206 cannot be drawn on a common axis: either the small curve is a flat line at zero or the large one is off-screen. The previous version drew both plus an inset at 3392x zoom, and the inset covered the sinusoid it was an inset of. Stacked panels give each curve its own scale and state the ratio instead of trying to draw it."
      - "Linear y-axis, not symlog: the Roemer delay is a pure sinusoid and symlog renders it as a flat-topped square wave, misstating the shape of the very curve the figure is about."
      - "The lensing panel has its own drawing grid (8000 points over 1.5 outer periods). F(w,y) is a closed form, so the drawing grid need not inherit the waveform sampling; the shared 576 s grid resolved the ringing but swallowed one oscillation, counting 30 zero crossings against 32 on a grid 38x finer."
      - "The fixed-w systematic on the PHASE is drawn as a band rather than left to a number, because it is what decides how much of the ringing can be read: the two large excursions (0.0121 cycles at y ~ 3) are 21x it, the far ringing is inside it. Out there the lensing has gone to zero while the error has not, which is why it never mattered that the approximations loosen away from alignment."
    supports: [doppler_dominates_the_lensing]
  - file: caseB_repeated_pulses.png
    produced_by: run.py::main
    shows: "|F(w_B,y(t))|^2 over the full 3-period observation."
    from_scratch: The F(t) evaluation via F_hybrid at each sampled y(t).
    from_library: matplotlib.
    supports: [repeated_lensing_pulses]
  - file: caseB_detector_view.png
    produced_by: run.py::main
    shows: >
      Idealized detector strain envelope over the full observation, and a
      five-cycle zoom at one pulse's peak instant. The zoom shows the
      AMPLITUDE difference, max_abs_F = 1.1766: crests 17.7% taller. It
      does not show a dephasing, and could not show one at this scale even
      if the effect were larger -- both curves share the same retarded
      time, so the Roemer delay cancels between them and only F is left,
      whose phase runs over 0.0174 cycles across the whole observation,
      sub-pixel here by construction. Nor is it the pulse's own sinc-like
      ringing shape, which lives on a ~day timescale and is
      caseB_repeated_pulses.png. The top panel's baseline drifts upward by
      1.287% over the 12 days: that is the source still inspiralling
      (0.05000 to 0.05097 Hz, and amplitude goes as f^(2/3)), matching
      (t_c/(t_c-T))^(1/4) = 1.01287, and it is the only place in Case B
      where "quasi-monochromatic" is visible.
    choices:
      - "The zoom is five carrier cycles (+-50 s), not thirty (+-300 s). At thirty the two curves cross sixty times across the frame and read as one sinusoid drawn twice, and the figure looked like it was understating the amplification -- which is how the window got revisited. Nothing is lost by narrowing: |F| moves 0.064% of its peak across +-300 s and 0.002% across +-50 s, so it was flat either way. Widening to where |F| really moves (+-2500 s, 4.4%) drops the cycles to 5 px and the carrier fills in as a block."
      - "Zoom panel y-limits symmetric about zero. The curves are a symmetric oscillation, and the asymmetric frame left by the old legend-headroom hack read as an offset that is not there."
    from_scratch: The dedicated fine time grid (dt=0.1s) for the zoom panel, built separately from the coarse envelope grid after the first version aliased using the coarse grid directly (see wiki/log.md).
    from_library: numpy, matplotlib.
    supports: [repeated_lensing_pulses]
