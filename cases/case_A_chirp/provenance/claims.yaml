claims:
  - id: static_lens_regime
    statement: >
      The chirp from f=10 Hz to f_isco takes 15.18 s, 4.4e-5 of the 4-day
      outer orbital period, so the lens is frozen at a single impact
      parameter for the whole observation.
    evidence:
      - run.py::build_waveform
      - tests/test_system.py::check_static_lens_regime
    numbers: [t_end_seconds, duration_seconds]
  - id: y_A_value
    statement: >
      The impact parameter at the illustrative merger phase (closest
      projected approach during the outer orbit) is y_A=1.589.
    evidence:
      - run.py::main (y_A search over one outer period)
      - src/gwlens/geometry.py::impact_parameter_of_time
    numbers: [y_A, y_A_outer_orbit_phase_fraction, lensed_at_merger_phase]
  - id: w_regime
    statement: >
      w spans 61.9 (f=10 Hz) to 777.6 (f=f_isco), both above the
      geometric-optics threshold w=30 where F_hybrid switches evaluators
      (agreement with the exact closed form <4% there, per
      tests/test_waveoptics.py::check_hybrid_matches_at_threshold).
    evidence:
      - src/gwlens/waveoptics.py::w_of_frequency
      - src/gwlens/waveoptics.py::F_hybrid
      - tests/test_waveoptics.py::check_hybrid_matches_at_threshold
      - tests/test_waveoptics.py::check_geometric_optics_limit
    numbers: [w_at_f_start, w_at_f_isco]
  - id: dephasing_not_simple_amplification
    statement: >
      Peak-sample amplification (1.091) and RMS amplification (1.056)
      differ from each other and from a naive "average |F|" expectation
      because F(f) modulates phase as well as amplitude across the band;
      the lensed waveform is a dephased copy of the unlensed one, not a
      rescaled one. RMS amplification is identical to a naive |F|-only
      calculation (Parseval's theorem: it depends only on |F(f)|, never on
      Fourier-phase convention), unlike the peak/echo timing claims below.
    evidence:
      - run.py::main (rms/peak amplification computation)
      - caseA_F_of_f.png (bottom sub-panel: arg F)
    numbers: [peak_strain_amplification, rms_strain_amplification]
  - id: causality_and_echo
    statement: >
      The combined lensed merger peak sits 0.60 s before the unlensed one
      (peak_time_lensed_minus_unlensed_s) -- an interference effect between
      two always-causal images (strong + weak, separated by a FIXED delay
      image_time_delay_seconds=3.434s), not acausality. Independent
      confirmation: a second, ~2-orders-fainter, genuinely separate copy of
      the whole merger/ringdown appears later (echo_peak_time_s), with the
      unlensed envelope at its noise floor at that same instant
      (echo_time_env_unlensed) while the lensed envelope is ~60x above it
      (echo_peak_env_lensed). The echo's observed arrival differs from the
      naive prediction (t_peak_unlensed + ΔT) by exactly the same 0.60 s as
      the near-merger interference shift (echo_peak_time_minus_prediction_s
      matches peak_time_lensed_minus_unlensed_s to three digits) -- both
      trace to the same cause. A prior version of this analysis had the
      project's Fourier sign convention backwards, making this look
      genuinely acausal; see wiki/log.md and wiki/conventions.md.
    evidence:
      - run.py::main (echo search, after the RMS/peak-amplification block)
      - src/gwlens/waveoptics.py::time_delay_difference
      - tests/test_waveoptics.py::check_causality_of_lensed_pulse
      - caseA_strain_time.png (third panel: echo zoom)
      - caseA_detector_envelope.png (log-scale, both peaks visible)
    numbers: [peak_time_lensed_minus_unlensed_s, image_time_delay_seconds,
      echo_peak_time_s, echo_peak_time_minus_prediction_s,
      echo_peak_env_lensed, echo_time_env_unlensed]
  - id: imr_waveform_and_bugs_fixed
    statement: >
      The unlensed waveform is IMRPhenomD (pycbc/LALSimulation, Khan et al.
      2016) where pycbc is importable (WSL2/Linux -- see README.md), a
      real inspiral-merger-ringdown; TaylorF2 (2PN inspiral-only) is used
      as an automatic fallback on native Windows where pycbc does not
      install. Two Fourier/alignment bugs were caught and fixed getting
      here: TaylorF2's SPA phase had its overall sign backwards relative
      to this project's Fourier convention, and pycbc's FD waveform is not
      delivered pre-aligned to a convenient positive merger time -- both
      diagnosed by the same symptom (reconstructed merger time moving with
      the amount of zero-padding) and both now guarded by regression checks.
    evidence:
      - src/gwlens/imr_waveform.py
      - src/gwlens/taylorf2.py::spa_phase
      - tests/test_taylorf2.py::check_ifft_reconstructs_chirp_at_tc
      - wiki/log.md
    numbers: [peak_time_unlensed_s, t_c_seconds, merger_time_target_s, waveform_source]
figures:
  - file: caseA_F_of_f.png
    produced_by: run.py::main
    shows: >
      |F(f)| and arg F(f) across the whole chirp band, plus a 3 Hz zoom
      where individual interference fringes are resolved.
    from_scratch: >
      Frequency array from the FFT of the generated chirp; fringe
      identification and the zoom window choice.
    from_library: >
      numpy.fft for the FFT/frequency grid, matplotlib for rendering.
    choices:
      - "3 Hz zoom width, chosen to show ~10 resolved fringes without over-cropping."
    supports: [w_regime]
  - file: caseA_strain_time.png
    produced_by: run.py::main
    shows: >
      Lensed vs. unlensed time-domain inspiral-merger-ringdown strain: a full
      overview (top, extended past merger to include the echo), a zoomed
      merger/ringdown panel (middle), and a zoomed echo panel (bottom) --
      the latter a fainter but recognisable replay of the whole chirp/
      merger/ringdown, as the geometric-optics image superposition predicts.
    from_scratch: >
      Frequency-domain lensing via FFT/IFFT; the merger-time alignment
      shift; the zoom window choices; the empirical echo-peak search
      (echo_peak_time_s and related numbers).
    from_library: pycbc (IMRPhenomD) or taylorf2.py fallback, numpy.fft, scipy.signal.hilbert, matplotlib.
    choices:
      - "D_eff = D_L = 5 kpc (same physical distance as the lens, not a separately fit source distance) -- an illustrative, unusually loud/nearby hypothetical event, stated explicitly."
      - "Merger placed at 85% of the FFT window (arbitrary but documented) so inspiral and ringdown both stay comfortably inside it."
      - "Echo panel centered on the empirically-found peak, not the naive t_peak_unlensed+ΔT prediction, which misses by ~0.6s (see causality_and_echo)."
    supports: [dephasing_not_simple_amplification, imr_waveform_and_bugs_fixed, causality_and_echo]
  - file: caseA_diffraction_pattern.png
    produced_by: run.py::main (make_ring_pattern)
    shows: >
      Extended |F(w,y)|^2 amplification pattern on the source plane at two
      frequencies, full pattern and zoomed near the source.
    from_scratch: >
      Radial F(w,r) evaluation and its interpolation onto a 2D grid;
      resolution chosen from the local fringe spacing 2*pi/(w*y).
    from_library: scipy.interpolate.interp1d, matplotlib (LogNorm colour scale).
    choices:
      - "Radial/display grid resolution set from the fringe spacing at each w, after a first version aliased (see wiki/log.md)."
      - "LogNorm color scale -- the central Einstein-ring spike otherwise saturates a linear scale."
    supports: [y_A_value, w_regime]
  - file: caseA_detector_envelope.png
    produced_by: run.py::main
    shows: >
      Idealized single-detector strain envelope (Hilbert transform), lensed
      vs. unlensed, log-scale, extended to show both the merger peak and the
      fainter second-image echo.
    from_scratch: Envelope comparison and the echo-window annotation.
    from_library: scipy.signal.hilbert.
    choices:
      - "No noise, antenna pattern, or PSD -- explicitly an idealized/illustrative detector view, as scoped in wiki/conventions.md."
      - "Log-scale y-axis: the echo is ~2 orders of magnitude below the merger peak and invisible on a linear scale."
    supports: [dephasing_not_simple_amplification, causality_and_echo]
