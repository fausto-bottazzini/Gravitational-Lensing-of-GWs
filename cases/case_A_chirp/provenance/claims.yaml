claims:
  - id: static_lens_regime
    statement: >
      The chirp from f=10 Hz to f_isco takes 15.18 s, 4.4e-5 of the 4-day
      outer orbital period, so the lens is frozen at a single impact
      parameter for the whole observation.
    evidence:
      - run.py::build_waveform_fd
      - tests/test_system.py::check_static_lens_regime
    numbers: [t_end_seconds, duration_seconds]
  - id: y_A_value
    statement: >
      The impact parameter at the illustrative merger phase (closest
      projected approach during the outer orbit) is y_A=1.589.
    evidence:
      - run.py::main (y_A search over one outer period)
      - src/gwlens/geometry.py::impact_parameter_of_time
    numbers: [y_A, y_A_outer_orbit_phase_fraction, lensed_at_merger_phase]
  - id: w_regime
    statement: >
      w spans 61.9 (f=10 Hz) to 777.6 (f=f_isco), both above the
      geometric-optics threshold w=30 where F_hybrid switches evaluators
      (agreement with the exact closed form <4% there, per
      tests/test_waveoptics.py::check_hybrid_matches_at_threshold).
    evidence:
      - src/gwlens/waveoptics.py::w_of_frequency
      - src/gwlens/waveoptics.py::F_hybrid
      - tests/test_waveoptics.py::check_hybrid_matches_at_threshold
      - tests/test_waveoptics.py::check_geometric_optics_limit
    numbers: [w_at_f_start, w_at_f_isco]
  - id: dephasing_not_simple_amplification
    statement: >
      Peak-sample amplification (1.065) and RMS amplification (1.056)
      differ from each other and from a naive "average |F|" expectation
      because F(f) modulates phase as well as amplitude across the band;
      the lensed waveform is a dephased copy of the unlensed one, not a
      rescaled one. arg F oscillates in a BOUNDED range (not a full 2*pi
      wind) once per fringe, in phase with |F| -- F traces a circle of
      radius sqrt(|mu_-|) centered on sqrt(mu_+) as w*DeltaT sweeps 2*pi
      per fringe, and does not enclose the origin since |mu_-|<mu_+ here.
      RMS amplification is identical to a naive |F|-only calculation
      (Parseval's theorem: it depends only on |F(f)|, never on the
      Fourier-phase reference convention), unlike the peak/echo timing
      claims below.
    evidence:
      - run.py::main (rms/peak amplification computation)
      - "caseA_F_of_f.png (bottom panel, arg F -- added after an independent review found this panel cited but not actually plotted)"
    numbers: [peak_strain_amplification, rms_strain_amplification]
  - id: geometric_optics_accuracy_at_this_y
    statement: >
      The whole band sits above w_geo_threshold=30, so every in-band F is the
      geometric-optics asymptotic form; at y_A=1.589 it agrees with the exact
      closed form to 1.9e-4 at f=10 Hz and 1.5e-5 at f_isco, and the
      threshold discontinuity there would be 3.1e-4 (the threshold is never
      crossed in band). Quoted at THIS y on purpose: the 3.1% reported by
      check_hybrid_matches_at_threshold is the worst case over y and is set
      entirely by y=0.3, where the two images are close together and highly
      magnified so stationary phase is weakest -- a y nothing in this project
      evaluates. Added 2026-09-07 after theory.tex was found quoting "0.4%"
      and "3.1%" two lines apart, measured at different y, reading as a
      contradiction.
    evidence:
      - run.py::main
      - tests/test_waveoptics.py::check_geometric_optics_limit
      - tests/test_waveoptics.py::check_hybrid_matches_at_threshold
    numbers: [geo_vs_exact_relerr_at_f_start, geo_vs_exact_relerr_at_f_isco,
              geo_vs_exact_relerr_at_threshold_w30, w_at_f_start, w_at_f_isco]
  - id: rms_amplification_equals_paczynski
    statement: >
      The RMS amplification is not a free number: by Parseval it is the
      |H(f)|^2-weighted mean of |F(f)|^2 over the band, and in the
      geometric-optics regime the interference term averages away over the
      ~400 in-band fringes, leaving mu_+ + |mu_-| -- the Paczynski (1986)
      total magnification A(y_A). So rms_strain_amplification must equal
      sqrt(A(y_A)) with nothing fitted: 1.0554959 vs 1.0558485, a relative
      3.3e-4 (9.6e-9 on the TaylorF2 fallback, whose band has no ringdown
      power above f_isco to unbalance the fringe average). This is the one
      end-to-end validation of the whole pipeline -- waveform generator, F
      evaluator, Fourier convention, reference phase, window -- against an
      independent textbook result; every other check in this repo validates
      one component against another. Added 2026-09-07: the prediction was
      always available and never stated.
    evidence:
      - run.py::main
      - src/gwlens/waveoptics.py::total_magnification_paczynski
      - tests/test_waveoptics.py::check_paczynski_magnification
      - Paczynski (1986)
    numbers: [rms_strain_amplification, total_magnification_paczynski,
              rms_amplification_predicted, rms_amplification_relerr]
  - id: source_kinematics_negligible_here
    statement: >
      Case A can treat the source as kinematically static -- a claim about
      the source's MOTION, separate from the static-lens claim about the
      geometry, and checked separately rather than inherited from it. The
      merger sits at the outer-orbital phase where the line-of-sight
      velocity crosses zero (mean beta_los over the chirp 2.3e-6); over a
      15 s window a constant delay and a constant slope are exactly
      degenerate with t_c and with the chirp mass, so only the curvature
      survives, at 8.6e-6 s = 0.0068 rad at f_isco. Reported, not applied:
      resampling h(t) onto a retarded grid would introduce interpolation
      error larger than the effect. The constant orbital redshift
      (4.08e-4) is likewise degenerate with the chirp mass -- an M_chirp
      bias, not a waveform feature. Added 2026-09-07, when Case B showed
      the same orbit's kinematics dominate there; see wiki/log.md.
    evidence:
      - src/gwlens/doppler.py::roemer_residual
      - src/gwlens/doppler.py::orbital_redshift_factor
      - tests/test_doppler.py::check_case_A_roemer_is_negligible
      - ../case_B_monochromatic/RESULTS.md (where the same effect dominates)
    numbers: [mean_beta_los_over_chirp, roemer_residual_ptp_s,
              roemer_residual_phase_at_fisco_rad, orbital_redshift_factor_minus_1]
  - id: causality_and_echo
    statement: >
      F(w,y) is referenced to the strong (minimum-time) image's own
      arrival (zero phase there by construction, waveoptics.py
      "REFERENCE-PHASE NORMALIZATION FIX"), so the combined lensed merger
      peaks at EXACTLY the unlensed merger time
      (peak_time_lensed_minus_unlensed_s=0.0). Independent confirmation: a
      second, genuinely separate copy of the whole merger/ringdown, as
      faint as echo_to_unlensed_peak_ratio=0.242 (matching the weak
      image's own magnification sqrt_mu_minus_geometric=0.240 to 1.1%),
      appears at echo_peak_time_s -- exactly image_time_delay_seconds=
      3.434s after the merger, to within echo_peak_time_minus_prediction_s
      =-4.0e-5s. The unlensed envelope is at its FFT-array noise floor at
      that instant (echo_time_env_unlensed) while the lensed envelope is
      ~60x above it (echo_peak_env_lensed). A prior version of this
      analysis omitted the reference-phase normalization above, which made
      the merger peak land 0.60s "early" and the echo miss its naive
      prediction by the same 0.60s -- explained at the time as an
      interference effect, which was wrong: it was exactly
      4*G*M_L*phi_+(y_A)/c^3, the un-subtracted, physically arbitrary
      absolute phase of the strong image, not interference (confirmed by
      reconstructing h_lensed from two pure delayed image copies and
      matching run.py's actual output to 1.1e-13). See wiki/log.md for the
      full account, including the earlier (also since-fixed) Fourier sign
      bug that first made this look acausal outright.
    evidence:
      - run.py::main (echo search, after the RMS/peak-amplification block)
      - src/gwlens/waveoptics.py::time_delay_difference
      - src/gwlens/waveoptics.py (module docstring, both fix notes)
      - tests/test_waveoptics.py::check_causality_of_lensed_pulse
      - tests/test_waveoptics.py::check_causality_of_lensed_pulse_low_w
      - caseA_strain_time.png (third panel: echo zoom)
      - caseA_spectrogram.png (both tracks visible)
    numbers: [peak_time_lensed_minus_unlensed_s, image_time_delay_seconds,
      echo_peak_time_s, echo_peak_time_minus_prediction_s,
      echo_peak_env_lensed, echo_time_env_unlensed,
      echo_to_unlensed_peak_ratio, sqrt_mu_minus_geometric,
      echo_ratio_vs_sqrt_mu_minus_relerr]
  - id: caseA_is_pure_geometric_optics
    statement: >
      Every in-band F value in Case A comes from F_geometric_optics
      (w_at_f_start=61.9, w_at_f_isco=777.6, both above
      w_geo_threshold=30) -- confirmed independently by reconstructing
      h_lensed from nothing but two delayed, rescaled copies of the
      unlensed waveform and finding max|h_lensed-h_two_image|/
      max|h_lensed|=1.1e-13, machine precision. The exact diffraction
      integral (F_point_lens/F_radial_1d/F_bruteforce_2d) contributes
      nothing measurable here; Case B (w_B=0.309, uses F_point_lens
      throughout) is where it does. A prior version of RESULTS.md
      described Case A's fringes as "genuinely wave optics (interference,
      not the smooth w->infinity envelope)" in the same breath as noting
      every F value already came from that envelope -- a direct
      self-contradiction, caught by an independent review.
    evidence:
      - src/gwlens/waveoptics.py::F_hybrid
      - run.py::main (min_abs_F_in_band/max_abs_F_in_band computation)
    numbers: [w_at_f_start, w_at_f_isco]
  - id: imr_waveform_and_bugs_fixed
    statement: >
      The unlensed waveform is IMRPhenomD (pycbc/LALSimulation, Khan et al.
      2016) where pycbc is importable (WSL2/Linux -- see README.md), a
      real inspiral-merger-ringdown; TaylorF2 (2PN inspiral-only) is used
      as an automatic fallback on native Windows where pycbc does not
      install. Two Fourier/alignment bugs were caught and fixed getting
      here: TaylorF2's SPA phase had its overall sign backwards relative
      to this project's Fourier convention, and pycbc's FD waveform is not
      delivered pre-aligned to a convenient positive merger time -- both
      diagnosed by the same symptom (reconstructed merger time moving with
      the amount of zero-padding) and both now guarded by regression checks.
    evidence:
      - src/gwlens/imr_waveform.py
      - src/gwlens/taylorf2.py::spa_phase
      - tests/test_taylorf2.py::check_ifft_reconstructs_chirp_at_tc
      - wiki/log.md
    numbers: [peak_time_unlensed_s, t_c_seconds, merger_time_target_s, waveform_source]
figures:
  - file: caseA_F_of_f.png
    produced_by: run.py::main
    shows: >
      |F(f)| over two 3 Hz windows at opposite ends of the chirp band --
      at 10 Hz (w=62) and at f_isco (w=778) -- with the exact envelope
      sqrt(mu_+)+-sqrt(|mu_-|) drawn on both, and arg F(f) over the first
      window. Two windows rather than one: what has to be seen is that
      the envelope width and the fringe period are the SAME at both ends,
      which is the geometric-optics statement, and a single window cannot
      show it.
    from_scratch: >
      Frequency array from the FFT of the generated chirp; the envelope
      bounds from image_positions/magnification at y_A; fringe
      identification, the zoom window choice, and the exact fringe period
      (1/image_time_delay_seconds, logged as fringe_period_hz).
    from_library: >
      numpy.fft for the FFT/frequency grid, matplotlib for rendering.
    choices:
      - "3 Hz window width, chosen to show ~10 resolved fringes without over-cropping. The same width at both ends of the band, so the two panels are directly comparable."
      - "No full-band panel. A full-band view of |F(f)| is either an unresolved blob (400 fringes across the axis) or, if only the envelope is drawn, a featureless shaded rectangle -- which is what the previous version of this figure was: it ASSERTED that the envelope is constant instead of showing it. Two resolved windows at w=62 and w=778 show the same thing and can be checked by eye."
      - "F evaluated on its own dense grid for these panels, not on the FFT grid the waveform uses: the fringe period is 0.29 Hz and the FFT bin spacing 0.04 Hz, so the curves were drawn from ~7 points per fringe and came out visibly polygonal. F(f) is a closed form, so the display grid costs nothing and need not inherit the waveform resolution."
    supports: [w_regime, dephasing_not_simple_amplification, caseA_is_pure_geometric_optics]
  - file: caseA_strain_time.png
    produced_by: run.py::main
    shows: >
      Five panels: the unlensed strain, the lensed strain on the same
      scale, a zoom centred on the merger, the MEASURED ratio of the two
      envelopes, and that same ratio IN CLOSED FORM directly below it.
      The first two are deliberately separate rather than overlaid: at
      this time resolution the curves are indistinguishable, which is the
      point, and drawing one over the other simply hid the lower one. The
      ratio panel is where the lensing becomes visible, and it is a ratio
      rather than a difference on purpose. Dividing the lensed analytic
      signal by the unlensed one leaves |F|; the chirp sweeps frequency
      monotonically, so plotting that against time sweeps out F's
      interference fringes, bounded by sqrt(mu_+) -/+ sqrt(|mu_-|) and
      crowding towards the merger as df/dt grows (1.0 fringes per second
      at 10 Hz, 93 per second at 36 Hz). A difference would instead
      isolate the second image as a delayed copy, which is a statement
      about arrival times rather than about interference, and the second
      image is a whole second track in caseA_spectrogram.png.
      The closed-form panel answers the obvious question about the
      measured one -- shouldn't the ratio just BE |F|? It is, in the
      middle; the two shaded regions are where it cannot be. Before
      t - t_merger = -11.75 s there is only one image (the second is the
      first delayed by 3.43 s and the signal starts 15.18 s before the
      merger), so the measured ratio sits flat at sqrt(mu_+) -- 1.0041 to
      1.0342 there against 1.0283, opening to the full 0.7895..1.2640 band
      from -11.5 s on -- while |F(f)|, a frequency-domain statement about
      the whole signal, oscillates anyway. After -3.22 s the analytic
      envelope can no longer follow the fringes and they shrink toward
      sqrt(mu_+), which is a property of the Hilbert transform and not of
      the lens.
    from_scratch: >
      Frequency-domain lensing via FFT/IFFT; the merger-time alignment
      shift; the zoom window choices; the empirical echo-peak search
      (echo_peak_time_s and related numbers).
    from_library: pycbc (IMRPhenomD) or taylorf2.py fallback, numpy.fft, scipy.signal.hilbert, matplotlib.
    choices:
      - "D_eff = D_L = 5 kpc (same physical distance as the lens, not a separately fit source distance) -- an illustrative, unusually loud/nearby hypothetical event, stated explicitly."
      - "Merger placed at 85% of the FFT window (arbitrary but documented) so inspiral and ringdown both stay comfortably inside it."
      - "Merger zoom centred on t_peak (+-0.15 s), not starting at it: the previous -0.05/+0.30 window put the merger hard against the left edge."
      - "Neither ratio panel runs past the merger, and that is forced, not chosen: after it there is no denominator. env_u falls to 1.6e-5 of its peak within 50 ms and the quotient runs to thousands -- the second image divided by numerical noise."
      - "The measured ratio is no longer truncated at the Hilbert validity limit (Delta_T*(df/dt)/f = 0.4, at -3.22 s). An earlier version cut it there; now it runs to the merger and the limit is shaded, which shows the boundary instead of hiding it, with the closed-form panel underneath to make it legible."
      - "Both ratio panels are drawn as a min-max band per pixel column rather than as sampled curves: near the merger one column spans dozens of fringes and point sampling would be pure alias. The closed-form extremes are exact (the fringe phase w*dT_hat = 2*pi*f*Delta_T is linear in f); the measured ones are the extremes of the samples in the column."
      - "Echo time is the empirically-found peak; it matches the naive t_peak_unlensed+ΔT prediction to within 4e-5 s (see causality_and_echo)."
    supports: [dephasing_not_simple_amplification, imr_waveform_and_bugs_fixed, causality_and_echo]
  - file: caseA_diffraction_pattern.png
    produced_by: run.py::main (make_ring_pattern)
    shows: >
      Extended |F(w,y)|^2 amplification pattern on the source plane at two
      frequencies, full pattern and zoomed near the source.
    from_scratch: >
      Radial F(w,r) evaluation and its interpolation onto a 2D grid;
      resolution chosen from the local fringe spacing 2*pi/(w*y).
    from_library: scipy.interpolate.interp1d, matplotlib (LogNorm colour scale).
    choices:
      - "Radial and display grid resolutions are both set from the local fringe spacing 2*pi/(w*y), which is what an earlier aliased version got wrong. Beyond resolution, both panels are now windowed so that the fringes are countable rather than merely present: the left panel to |y|<1.6 at n_grid=1601, the right to |Delta y|<0.02 at w=778, where the fringe period is ~0.003 and the previous 0.30-wide window packed a hundred rings into 500 pixels. Nothing is lost by cropping -- the pattern is axisymmetric and the outer rings are more of the same."
      - "savefig(bbox_inches='tight'): with set_aspect('equal') the axes are resized after tight_layout has computed positions, so both panels' x-axis label ($y_1$) was drawn below the canvas and cut off in the previously committed PNG. Fixed 2026-09-07."
      - "LogNorm color scale -- the central Einstein-ring spike otherwise saturates a linear scale."
      - "F_point_lens (exact) forced for r<0.5 regardless of w, not F_hybrid: at w=61.9 (left panel) F_hybrid always returns F_geometric_optics, which diverges as y->0 -- an earlier version of this figure plotted that divergence, cut off only by the innermost grid sample (1123 vs. the true finite pi*w=194.45), as if it were the regularized wave-optics value the caption describes; an independent review caught this (the figure demonstrated the opposite of its own caption). See wiki/log.md."
    supports: [y_A_value, w_regime]
  - file: caseA_spectrogram.png
    produced_by: run.py::main
    shows: >
      The chirp in time-frequency, the way a chirp is normally shown:
      spectrogram amplitude, log frequency, unlensed above and lensed
      below on one colour scale. The unlensed panel is a single track
      sweeping up to the merger; the lensed panel has TWO, the same sweep
      repeated Delta_T=3.43 s later at sqrt(|mu_-|)=0.24 of the amplitude.
      Two images become two tracks, which is geometric-optics lensing in
      one picture. The stipple along the lensed track at low frequency is
      the interference between them -- the same fringes the ratio panel of
      caseA_strain_time.png measures.
    from_scratch: The lensed waveform; the window and dynamic-range choices.
    from_library: scipy.signal.spectrogram, matplotlib (LogNorm).
    choices:
      - "Replaces an amplitude-vs-time plot of the same two waveforms, which said nothing caseA_strain_time.png did not already say. A spectrogram says something neither says: that the lens puts a second track on the time-frequency plane."
      - "nperseg=1024 at fs=2048, i.e. a 0.5 s window: five cycles at the 10 Hz band start, the least that still localises the low end, and short enough that the 0.29 Hz interference fringes do not resolve into the picture (they are caseA_F_of_f.png's subject)."
      - "Hann window rather than scipy's default Tukey(0.25): ~30 dB lower sidelobes. With three decades of colour range the Tukey sidelobes drew a fan of spurious arcs above the real track; the range is now two decades and the window is Hann."
      - "No noise, antenna pattern, or PSD -- an idealized view, as scoped in wiki/conventions.md."
    supports: [causality_and_echo, dephasing_not_simple_amplification]
